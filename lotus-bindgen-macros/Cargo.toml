[package]
name = "lotussim-bindgen-macros"
version = "0.1.2"
description = "Proc-macros for LOTUS-Simulator scripts. Depend on `lotussim-script` instead of using this crate directly."
documentation = "https://docs.rs/lotussim-script"
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lotus_bindgen_macros"
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["full"] }
