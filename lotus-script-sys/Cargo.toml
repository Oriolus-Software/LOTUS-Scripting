[package]
name = "lotussim-script-sys"
version = "0.5.1"
description = "Low-level WASM FFI bindings for LOTUS-Simulator scripts. Depend on `lotussim-script` instead of using this crate directly."
documentation = "https://docs.rs/lotussim-script"
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "lotus_script_sys"

[dependencies]
lotus-bindgen-macros = { workspace = true }
rmp-serde.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_repr.workspace = true
