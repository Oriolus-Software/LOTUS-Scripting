[package]
name = "lotussim-shared"
version = "0.6.1"
description = "Shared types for LOTUS-Simulator scripts. Depend on `lotussim-script` instead of using this crate directly."
documentation = "https://docs.rs/lotussim-script"
edition.workspace = true
license.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
features = ["ffi"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "lotus_shared"

[features]
default = []
internal = []
ffi = ["dep:lotus-script-sys"]
engine = ["bevy", "image", "time"]
bevy = ["dep:bevy"]
image = ["dep:image"]
time = ["dep:time"]

[dependencies]
bevy = { workspace = true, optional = true, features = ["bevy_color"] }
glam = { version = "0.30", features = ["serde"] }
image = { workspace = true, optional = true }
lotus-script-sys = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_repr.workspace = true
thiserror.workspace = true
time = { workspace = true, optional = true }
